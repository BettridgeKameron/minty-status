owner: BettridgeKameron
repo: minty-status
user-agent: minty-status
secrets: []

sites:
  - name: Primary status API
    url: https://status.mintydev.gay/api/v1/endpoints/statuses
    expectedStatusCodes: [200]
    maxResponseTime: 10000

assignees:
  - BettridgeKameron
skipDeleteIssues: true
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  baseUrl: /minty-status
  theme: night
  name: Mintydev fallback status
  introTitle: Mintydev external fallback
  introMessage: GitHub checks whether the primary status service is responding.
  navbar:
    - title: Primary status
      href: https://status.mintydev.gay/
    - title: Fallback
      href: /minty-status/
    - title: GitHub
      href: https://github.com/BettridgeKameron/minty-status
